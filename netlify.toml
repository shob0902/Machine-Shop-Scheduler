[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Client-side routing (React Router) - send everything to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# VITE_API_BASE_URL must be set in the Netlify UI (Site settings > Environment
# variables) to the deployed Render backend URL, e.g.
#   VITE_API_BASE_URL=https://machine-shop-scheduler-backend.onrender.com
# It is intentionally NOT hardcoded here - see README "Deployment".
